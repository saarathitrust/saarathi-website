<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | SAARATHI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
--brand-blue:#2b2e83;
--brand-green:#2f6b2f;
}

body{
background:#f8f9fa;
font-family:"Open Sans",sans-serif;
margin:0;
}

/* NAVBAR STYLE */

.navbar-custom{
background:#2b2e83;
padding:12px 0;
box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.navbar-dark .nav-link{
color:white !important;
font-weight:600;
}

/* CONTACT CARD */

.contact-card{
border-radius:15px;
box-shadow:0 15px 35px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>


<!-- CONTACT SECTION -->

<section class="py-5">

<div class="container">

<h2 class="text-center mb-5" style="color:#2b2e83;">Contact SAARATHI</h2>

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card contact-card border-0 p-4 text-center">

<h5 class="text-success">Email</h5>
<p>saarathitrust@gmail.com</p>

<h5 class="text-success">Phone</h5>
<p>+91 7411403290</p>

<h5 class="text-success">Address</h5>

<p>
#164, 2nd Floor, 1st Main<br>
BEML 4th Stage, RR Nagar<br>
Bangalore – 560098
</p>

</div>

</div>

</div>

</div>

</section>


<!-- FOOTER -->
<div id="footer"></div>


<!-- SCRIPTS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* Load Navbar */

fetch("navbar.html")
.then(res => res.text())
.then(data => {

document.getElementById("navbar").innerHTML = data;

/* Highlight active page */

let currentPage = window.location.pathname.split("/").pop();

let links = document.querySelectorAll(".nav-link");

links.forEach(link => {

let linkPage = link.getAttribute("href");

if(linkPage === currentPage){
link.classList.add("active");
}

});

});


/* Load Footer */

fetch("footer.html")
.then(res => res.text())
.then(data => {
document.getElementById("footer").innerHTML = data;
});

</script>

</body>

</html>
