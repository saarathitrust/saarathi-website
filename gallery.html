```html
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAARATHI NGO | Gallery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --brand-blue: #2b2e83;
  --brand-green: #2f6b2f;
}

body{
  font-family:"Open Sans", sans-serif;
  margin:0;
  background:#f8f9fa;
}

/* SECTION STYLE LIKE HOME */
.section{
  padding:60px 0;
}

/* TITLE */
.section-title{
  text-align:center;
  color:var(--brand-blue);
  font-weight:700;
  margin-bottom:40px;
}

/* GALLERY GRID */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:30px;
}

/* CARD */
.card{
  border:none;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  transition:0.3s;
}
.card:hover{
  transform:translateY(-6px);
}

/* SLIDER */
.slider{
  position:relative;
  height:220px;
}
.slide{
  width:100%;
  height:220px;
  object-fit:cover;
  display:none;
  cursor:pointer;
}
.slide.active{
  display:block;
}

/* ARROWS */
.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.5);
  color:white;
  border:none;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
}
.prev{left:10px;}
.next{right:10px;}

.card-body{
  padding:20px;
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.lightbox img{
  max-width:90%;
  max-height:80%;
}

.lightbox .close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  color:white;
  cursor:pointer;
}

.lightbox .arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(255,255,255,0.2);
  border:none;
  color:white;
  font-size:30px;
  padding:10px;
}
.lightbox .prev{left:20px;}
.lightbox .next{right:20px;}

/* FLOAT BUTTONS SAME AS HOME */
.floating-donate{
  position:fixed;
  bottom:25px;
  right:25px;
  background:#2f6b2f;
  color:white;
  padding:12px 22px;
  border-radius:50px;
  font-weight:bold;
  text-decoration:none;
  z-index:9999;
}

.whatsapp-button{
  position:fixed;
  bottom:90px;
  right:25px;
  background:#25d366;
  color:white;
  padding:12px 18px;
  border-radius:50px;
  font-weight:bold;
  text-decoration:none;
  z-index:9999;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- GALLERY SECTION -->
<section class="section">
<div class="container">
<h2 class="section-title">Activities - 2025</h2>

<div class="gallery">

<!-- Summer Camp -->
<div class="card">
<div class="slider">
<img src="images/camp1.jpeg" class="slide active">
<img src="images/camp2.jpeg" class="slide">
<img src="images/camp3.jpeg" class="slide">
<img src="images/camp4.jpeg" class="slide">
<img src="images/camp5.jpeg" class="slide">
<button class="arrow prev" onclick="changeSlide(this,-1)">❮</button>
<button class="arrow next" onclick="changeSlide(this,1)">❯</button>
</div>
<div class="card-body">
<h5>Summer Camp</h5>
<p>70 students participated</p>
</div>
</div>

<!-- Beechaganahalli -->
<div class="card">
<div class="slider">
<img src="images/beech1.jpeg" class="slide active">
<img src="images/beech2.jpeg" class="slide">
<img src="images/beech3.jpeg" class="slide">
<img src="images/beech4.jpeg" class="slide">
<img src="images/beech5.jpeg" class="slide">
<button class="arrow prev" onclick="changeSlide(this,-1)">❮</button>
<button class="arrow next" onclick="changeSlide(this,1)">❯</button>
</div>
<div class="card-body">
<h5>School Visit</h5>
<p>Beechaganahalli – Chikkaballapura</p>
</div>
</div>

<!-- Channapatna -->
<div class="card">
<div class="slider">
<img src="images/channa1.jpeg" class="slide active">
<img src="images/channa2.jpeg" class="slide">
<img src="images/channa3.jpeg" class="slide">
<img src="images/channa4.jpeg" class="slide">
<img src="images/channa5.jpeg" class="slide">
<img src="images/channa6.jpeg" class="slide">
<button class="arrow prev" onclick="changeSlide(this,-1)">❮</button>
<button class="arrow next" onclick="changeSlide(this,1)">❯</button>
</div>
<div class="card-body">
<h5>School Visits – Channapatna</h5>
<p>Multiple villages</p>
</div>
</div>

<!-- ADD remaining cards same way -->

</div>
</div>
</section>

<!-- FOOTER -->
<div id="footer"></div>

<!-- FLOATING BUTTONS -->
<a href="https://wa.me/917411403290" class="whatsapp-button">💬 WhatsApp</a>
<a href="donate.html" class="floating-donate">❤ Donate</a>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
<span class="close" onclick="closeLightbox()">×</span>
<button class="arrow prev" onclick="changeLightboxSlide(-1)">❮</button>
<img id="lightbox-img">
<button class="arrow next" onclick="changeLightboxSlide(1)">❯</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* LOAD NAVBAR */
fetch("navbar.html")
.then(res => res.text())
.then(data => {
document.getElementById("navbar").innerHTML = data;
});

/* LOAD FOOTER */
fetch("footer.html")
.then(res => res.text())
.then(data => {
document.getElementById("footer").innerHTML = data;
});

/* SLIDER */
function changeSlide(btn,dir){
let slides=btn.parentElement.querySelectorAll(".slide");
let i=0;

slides.forEach((s,index)=>{
if(s.classList.contains("active")){
i=index;
s.classList.remove("active");
}
});

i+=dir;
if(i<0)i=slides.length-1;
if(i>=slides.length)i=0;

slides[i].classList.add("active");
}

/* LIGHTBOX */
let currentSlides=[],currentIndex=0;

document.querySelectorAll(".slide").forEach(img=>{
img.onclick=function(){
let slider=this.parentElement;
currentSlides=slider.querySelectorAll(".slide");

currentSlides.forEach((s,i)=>{
if(s.classList.contains("active")) currentIndex=i;
});

document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=currentSlides[currentIndex].src;
};
});

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}

function changeLightboxSlide(dir){
currentIndex+=dir;

if(currentIndex<0)currentIndex=currentSlides.length-1;
if(currentIndex>=currentSlides.length)currentIndex=0;

document.getElementById("lightbox-img").src=currentSlides[currentIndex].src;
}

</script>

</body>
</html>
