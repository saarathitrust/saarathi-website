<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saarathi Trust Gallery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f5f5f5;
}

/* REMOVE GAP BELOW NAVBAR */
#navbar{
  margin-bottom:0;
}

/* MAIN SECTION */
.main-content{
  padding-top:20px;
}

/* TITLE */
.title{
  text-align:center;
  font-size:36px;
  font-weight:bold;
  margin:30px 0;
}

/* GRID */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:30px;
  padding:20px 60px 60px;
}

/* CARD */
.card{
  background:white;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  overflow:hidden;
  transition:0.3s;
}
.card:hover{
  transform:translateY(-6px);
}

/* SLIDER */
.slider{
  position:relative;
  height:220px;
  overflow:hidden;
}
.slide{
  width:100%;
  height:220px;
  object-fit:cover;
  display:none;
  cursor:pointer;
}
.slide.active{
  display:block;
}

/* ARROWS */
.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.5);
  color:white;
  border:none;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
}
.prev{left:10px;}
.next{right:10px;}

.card-content{
  padding:20px;
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.lightbox img{
  max-width:90%;
  max-height:80%;
}

.lightbox .close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  color:white;
  cursor:pointer;
}

.lightbox .arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(255,255,255,0.2);
  border:none;
  color:white;
  font-size:30px;
  padding:10px;
}
.lightbox .prev{left:20px;}
.lightbox .next{right:20px;}

/* MOBILE */
@media (max-width:768px){
.gallery{
  grid-template-columns:1fr;
  padding:20px;
}
}
</style>
</head>

<body>

<!-- HEADER -->
<div id="navbar"></div>

<div class="main-content">

<div class="title">Activities - 2025</div>

<div class="gallery">

<!-- Summer Camp -->
<div class="card">
<div class="slider">
<img src="images/camp1.jpeg" class="slide active">
<img src="images/camp2.jpeg" class="slide">
<img src="images/camp3.jpeg" class="slide">
<img src="images/camp4.jpeg" class="slide">
<img src="images/camp5.jpeg" class="slide">
<button class="arrow prev" onclick="changeSlide(this,-1)">❮</button>
<button class="arrow next" onclick="changeSlide(this,1)">❯</button>
</div>
<div class="card-content">
<h3>Summer Camp</h3>
<p>70 students participated</p>
</div>
</div>

<!-- Beechaganahalli -->
<div class="card">
<div class="slider">
<img src="images/beech1.jpeg" class="slide active">
<img src="images/beech2.jpeg" class="slide">
<img src="images/beech3.jpeg" class="slide">
<img src="images/beech4.jpeg" class="slide">
<img src="images/beech5.jpeg" class="slide">
<button class="arrow prev" onclick="changeSlide(this,-1)">❮</button>
<button class="arrow next" onclick="changeSlide(this,1)">❯</button>
</div>
<div class="card-content">
<h3>School Visit</h3>
<p>Beechaganahalli – Chikkaballapura</p>
</div>
</div>

<!-- ADD REST SAME (you already have them correct) -->

</div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
<span class="close" onclick="closeLightbox()">×</span>
<button class="arrow prev" onclick="changeLightboxSlide(-1)">❮</button>
<img id="lightbox-img">
<button class="arrow next" onclick="changeLightboxSlide(1)">❯</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* LOAD NAVBAR */
fetch("navbar.html")
.then(res => res.text())
.then(data => {
document.getElementById("navbar").innerHTML = data;
});

/* LOAD FOOTER */
fetch("footer.html")
.then(res => res.text())
.then(data => {
document.getElementById("footer").innerHTML = data;
});

/* SLIDER */
function changeSlide(btn,dir){
let slides=btn.parentElement.querySelectorAll(".slide");
let i=0;

slides.forEach((s,index)=>{
if(s.classList.contains("active")){
i=index;
s.classList.remove("active");
}
});

i+=dir;
if(i<0)i=slides.length-1;
if(i>=slides.length)i=0;

slides[i].classList.add("active");
}

/* LIGHTBOX */
let currentSlides=[],currentIndex=0;

document.querySelectorAll(".slide").forEach(img=>{
img.onclick=function(){
let slider=this.parentElement;
currentSlides=slider.querySelectorAll(".slide");

currentSlides.forEach((s,i)=>{
if(s.classList.contains("active")) currentIndex=i;
});

document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=currentSlides[currentIndex].src;
};
});

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}

function changeLightboxSlide(dir){
currentIndex+=dir;

if(currentIndex<0)currentIndex=currentSlides.length-1;
if(currentIndex>=currentSlides.length)currentIndex=0;

document.getElementById("lightbox-img").src=currentSlides[currentIndex].src;
}

</script>

</body>
</html>
