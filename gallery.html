<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saarathi Trust Gallery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

<style>
:root{
  --brand-blue:#2b2e83;
}

body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f5f5f5;
}

/* NAVBAR */
.navbar-custom{
  background:#2b2e83;
  padding:12px 0;
}

/* TITLE */
.title{
  text-align:center;
  font-size:36px;
  margin-top:40px;
  font-weight:bold;
}

/* GRID */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:30px;
  padding:50px 80px;
}

/* CARD */
.card{
  background:white;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  overflow:hidden;
  transition:0.3s;
}
.card:hover{
  transform:translateY(-6px);
}

/* SLIDER */
.slider{
  position:relative;
  height:220px;
  overflow:hidden;
}
.slide{
  width:100%;
  height:220px;
  object-fit:cover;
  display:none;
  cursor:pointer;
}
.slide.active{
  display:block;
}

/* ARROWS */
.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.5);
  color:white;
  border:none;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
}
.prev{left:10px;}
.next{right:10px;}

/* TEXT */
.card-content{
  padding:20px;
}

/* MOBILE */
@media (max-width:768px){
.gallery{
  grid-template-columns:1fr;
  padding:20px;
}
.title{
  font-size:28px;
}
.card{
  max-width:420px;
  margin:auto;
}
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.lightbox img{
  max-width:90%;
  max-height:80%;
  border-radius:10px;
}

.lightbox .close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  color:white;
  cursor:pointer;
}

.lightbox .arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(255,255,255,0.2);
  border:none;
  color:white;
  font-size:30px;
  padding:10px;
  cursor:pointer;
}
.lightbox .prev{left:20px;}
.lightbox .next{right:20px;}

</style>
</head>

<body>

<div class="title">Activities - 2025</div>

<div class="gallery">

<!-- CARD -->
<div class="card">
  <div class="slider">
    <img src="images/camp1.jpeg" class="slide active">
    <img src="images/camp2.jpeg" class="slide">
    <img src="images/camp3.jpeg" class="slide">
    <button class="arrow prev" onclick="changeSlide(this,-1)">❮</button>
    <button class="arrow next" onclick="changeSlide(this,1)">❯</button>
  </div>
  <div class="card-content">
    <h3>Summer Camp</h3>
    <p>70 students participated</p>
  </div>
</div>

<!-- ADD MORE CARDS SAME WAY -->

</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span class="close" onclick="closeLightbox()">×</span>
  <button class="arrow prev" onclick="changeLightboxSlide(-1)">❮</button>
  <img id="lightbox-img">
  <button class="arrow next" onclick="changeLightboxSlide(1)">❯</button>
</div>

<script>

/* NORMAL SLIDER */
function changeSlide(button, direction){
  let slider = button.parentElement;
  let slides = slider.querySelectorAll(".slide");

  let index=0;
  slides.forEach((s,i)=>{
    if(s.classList.contains("active")){
      index=i;
      s.classList.remove("active");
    }
  });

  index+=direction;

  if(index<0) index=slides.length-1;
  if(index>=slides.length) index=0;

  slides[index].classList.add("active");
}

/* LIGHTBOX LOGIC */
let currentSlides=[];
let currentIndex=0;

document.querySelectorAll(".slide").forEach((img)=>{
  img.addEventListener("click",function(){

    let slider=this.parentElement;
    currentSlides=slider.querySelectorAll(".slide");

    currentSlides.forEach((s,i)=>{
      if(s.classList.contains("active")){
        currentIndex=i;
      }
    });

    document.getElementById("lightbox").style.display="flex";
    document.getElementById("lightbox-img").src=currentSlides[currentIndex].src;
  });
});

function closeLightbox(){
  document.getElementById("lightbox").style.display="none";
}

function changeLightboxSlide(direction){
  currentIndex+=direction;

  if(currentIndex<0) currentIndex=currentSlides.length-1;
  if(currentIndex>=currentSlides.length) currentIndex=0;

  document.getElementById("lightbox-img").src=currentSlides[currentIndex].src;
}

/* KEYBOARD SUPPORT */
document.addEventListener("keydown",function(e){
  if(document.getElementById("lightbox").style.display==="flex"){
    if(e.key==="ArrowRight") changeLightboxSlide(1);
    if(e.key==="ArrowLeft") changeLightboxSlide(-1);
    if(e.key==="Escape") closeLightbox();
  }
});

</script>

</body>
</html>
