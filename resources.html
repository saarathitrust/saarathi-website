<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resources | SAARATHI NGO</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand-blue: #2b2e83;
        --brand-green: #2f6b2f;
      }
      body {
        font-family: "Open Sans", sans-serif;
        background: #f9fafb;
      }
      .section-title {
        color: var(--brand-blue);
        font-weight: 700;
      }
      .resource-card {
        border-radius: 15px;
        padding: 25px;
        background: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        transition: 0.3s;
      }
      .resource-card:hover {
        transform: translateY(-6px);
      }
    </style>
  </head>
  <body>
    <div id="navbar"></div>
    <section class="py-5">
      <div class="container">
        <h2 class="text-center section-title mb-5">Resources</h2>
        <div class="row g-4">
          <div class="col-md-6">
            <div class="resource-card">
              <h4>News & Events</h4>
              <p>
                Explore our recent activities, programs and outreach
                initiatives.
              </p>
              <a href="news.html" class="btn btn-success mt-3"> View Events </a>
            </div>
          </div>
          <div class="col-md-6">
            <div class="resource-card">
              <h4>Financial Reports</h4>
              <p>Access annual reports and financial transparency documents.</p>
              <a href="reports.html" class="btn btn-success mt-3">
                View Reports
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      fetch("navbar.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });
      fetch("footer.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>
