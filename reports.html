<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financial Reports | SAARATHI NGO</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand-blue: #2b2e83;
      }
      body {
        font-family: "Open Sans", sans-serif;
        background: #f8f9fa;
      }
      .report-card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }
      .section-title {
        color: var(--brand-blue);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="navbar"></div>
    <section class="py-5">
      <div class="container">
        <h2 class="text-center section-title mb-5">Financial Reports</h2>
        <div class="row g-4">
          <div class="col-md-4">
            <div class="report-card">
              <h5>Annual Report 2026</h5>
              <a href="#" class="btn btn-success mt-2">Download</a>
            </div>
          </div>
          <div class="col-md-4">
            <div class="report-card">
              <h5>Annual Report 2025</h5>
              <a href="#" class="btn btn-success mt-2">Download</a>
            </div>
          </div>
          <div class="col-md-4">
            <div class="report-card">
              <h5>Annual Report 2024</h5>
              <a href="#" class="btn btn-success mt-2">Download</a>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      fetch("navbar.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("navbar").innerHTML = data;
        });
      fetch("footer.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
  </body>
</html>
