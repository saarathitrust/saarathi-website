<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financial Reports | SAARATHI NGO</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
--brand-blue:#2b2e83;
--brand-green:#2f6b2f;
}

body{
font-family:"Open Sans",sans-serif;
background:#f8f9fa;
margin:0;
}

.navbar-custom{
background:#2b2e83;
padding:12px 0;
box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.navbar-dark .nav-link{
color:white !important;
font-weight:600;
}

.report-card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.3s;
height:100%;
text-align:center;
}

.report-card:hover{
transform:translateY(-5px);
}

.section-title{
color:var(--brand-blue);
font-weight:700;
}

.pdf-icon{
font-size:55px;
color:#dc3545;
margin-bottom:15px;
}

</style>

</head>

<body>

<div id="navbar"></div>

<section class="py-5">

<div class="container">

<h2 class="text-center section-title mb-5">
Financial Reports
</h2>

<div class="row g-4 justify-content-center">

<!-- 2025-26 -->

<div class="col-md-5">

<div class="report-card">

<i class="fa-solid fa-file-pdf pdf-icon"></i>

<h5>Annual Report 2025–26</h5>

<p class="text-muted">
SAARATHI Annual Activities & Financial Summary
</p>

<a href="reports/Annual Report 2025-26.pdf"
target="_blank"
class="btn btn-success mt-2">

<i class="fa-solid fa-download me-2"></i>
Download Report

</a>

</div>

</div>


<!-- 2024-25 -->

<div class="col-md-5">

<div class="report-card">

<i class="fa-solid fa-file-pdf pdf-icon"></i>

<h5>Annual Report 2024–25</h5>

<p class="text-muted">
SAARATHI Annual Activities & Financial Summary
</p>

<a href="reports/Annual Report 2024-25.pdf"
target="_blank"
class="btn btn-success mt-2">

<i class="fa-solid fa-download me-2"></i>
Download Report

</a>

</div>

</div>

</div>

</div>

</section>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* Navbar */

fetch("navbar.html")
.then(res=>res.text())
.then(data=>{

document.getElementById("navbar").innerHTML=data;

let currentPage=window.location.pathname.split("/").pop();

let links=document.querySelectorAll(".nav-link");

links.forEach(link=>{

let linkPage=link.getAttribute("href");

if(linkPage===currentPage){

link.classList.add("active");

}

});

});


/* Footer */

fetch("footer.html")
.then(res=>res.text())
.then(data=>{

document.getElementById("footer").innerHTML=data;

});

</script>

</body>
</html>
